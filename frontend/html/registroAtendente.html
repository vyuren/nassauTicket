<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/frontend/css/registroAtendente.css">
</head>
<body>
    <div id="board">

        <form id="cadastro">

            <input placeholder="nome completo" id="nome" type="text" maxlength="50" required><br>
            <input placeholder="senha" id="senha" type="password" minlength="8" maxlength="20" required><br>
            <input placeholder="e-mail" id="email" type="email" maxlength="50" required><br>
            <input placeholder="000.000.000-00" id="cpf" name="cpf" required maxlength="14"><br>
            <input placeholder="data de nascimento" type="date" required><br>

            <button id="confirmar">Confirmar</button>
        </form>
    </div>
</body>
</html>
